trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      docker --version
      docker compose version
    displayName: "Check Docker tools"

  - script: |
      docker compose build vote result worker
    displayName: "Build application images"

  - script: |
      echo "Build ID: $(Build.BuildId)"
      echo "Source commit: $(Build.SourceVersion)"
      echo "Branch: $(Build.SourceBranch)"
    displayName: "Record build metadata"

  - script: |
      docker image ls
    displayName: "List built images"
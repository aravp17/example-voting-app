trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      docker --version
      docker compose version
    displayName: "Check Docker tools"

  - script: |
      docker compose -p votingapp build vote result worker
    displayName: "Build application images"

  - script: |
      echo "Build ID: $(Build.BuildId)"
      echo "Source commit: $(Build.SourceVersion)"
      echo "Branch: $(Build.SourceBranch)"
    displayName: "Record build metadata"

  - script: |
      set -eu

      docker image tag votingapp-vote:latest \
        "voting-app-vote:$(Build.BuildId)"

      docker image tag votingapp-result:latest \
        "voting-app-result:$(Build.BuildId)"

      docker image tag votingapp-worker:latest \
        "voting-app-worker:$(Build.BuildId)"
    displayName: "Tag application images"

  - script: |
      set -eu

      docker image inspect "voting-app-vote:$(Build.BuildId)"
      docker image inspect "voting-app-result:$(Build.BuildId)"
      docker image inspect "voting-app-worker:$(Build.BuildId)"

      echo "All three versioned images exist."
    displayName: "Validate versioned images"
  
  - script: |
      set -eu

      echo "Vote image:"
      docker image inspect \
        --format='Image ID: {{.Id}}' \
        "voting-app-vote:$(Build.BuildId)"

      echo "Result image:"
      docker image inspect \
        --format='Image ID: {{.Id}}' \
        "voting-app-result:$(Build.BuildId)"

      echo "Worker image:"
      docker image inspect \
        --format='Image ID: {{.Id}}' \
        "voting-app-worker:$(Build.BuildId)"
    displayName: "Inspect versioned images"

  - script: |
      set -eu

      docker compose -p votingapp up -d --no-build vote result worker

      echo "Container status:"
      docker compose -p votingapp ps
    displayName: "Start and inspect application"
  
  - script: |
      set -eu

      check_endpoint() {
        url="$1"
        name="$2"
        attempt=1

        while [ "$attempt" -le 30 ]; do
          if curl --fail --silent \
            --output /dev/null "$url"; then
            echo "$name is responding successfully."
            return 0
          fi

          echo "Waiting for $name (attempt $attempt/30)..."
          sleep 2
          attempt=$((attempt + 1))
        done

        echo "ERROR: $name did not respond at $url"
        return 1
      }

      check_endpoint "http://localhost:8080/" "Vote UI"
      check_endpoint "http://localhost:8081/" "Results UI"
    displayName: "Smoke test web interfaces"

  - script: |
      docker compose -p votingapp logs --no-color
    displayName: "Capture application logs"
    condition: always()

  - script: |
      docker compose -p votingapp down -v
    displayName: "Clean up test environment"
    condition: always()

  - script: |
      docker image ls
    displayName: "List built images"
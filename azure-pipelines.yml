trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      docker --version
      docker compose version
    displayName: "Check Docker tools"

  - script: |
      docker compose build vote result worker
    displayName: "Build application images"

  - script: |
      docker image tag "$(docker compose images -q vote)" "voting-app-vote:$(Build.BuildId)"
      docker image tag "$(docker compose images -q result)" "voting-app-result:$(Build.BuildId)"
      docker image tag "$(docker compose images -q worker)" "voting-app-worker:$(Build.BuildId)"
    displayName: "Tag application images"

  - script: |
      docker image ls voting-app-vote
      docker image ls voting-app-result
      docker image ls voting-app-worker
    displayName: "Verify versioned images"